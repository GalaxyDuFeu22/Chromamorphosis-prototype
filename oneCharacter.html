<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="robots" content="noindex">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="icons/site_icon.png" rel="icon">
    <link href="style.css" rel="stylesheet">
    <title>Character</title>
</head>
<body id="charBackground">
    <div id="bg"></div>
    <div id="languages">
            <button id="en">EN</button>
            <button id="fr">FR</button>
    </div>
    <a id="back" href="characters.html"></a>
    <h1 id="charName"></h1>
    <i id="charTitle"></i>
    <section id="charSection01">
        <div id="identity">
            <img id="charProfil" alt="Character's profil picture">
            <div>
                <ul>
                    <li><strong data-i18n="li1">Full name : </strong><span id="charFullname"></span></li>
                    <li><strong data-i18n="li3">Age : </strong><span id="charAge"></span></li>
                    <li><strong data-i18n="li4">Birthday : </strong><span id="charBirthday"></span></li>
                    <li><strong data-i18n="li5">Gender : </strong><span id="charGender"></span></li>
                    <li><strong data-i18n="li6">Sexual orientation : </strong><span id="charOrientation"></span></li>
                    <li><strong data-i18n="li7">Height : </strong><span id="charHeight"></span></li>
                    <li><strong data-i18n="li8">Weight : </strong><span id="charWeight"></span></li>
                    <li><strong data-i18n="li9">Current situation : </strong></li>
                    <ul>
                        <li id="charSituation01"></li>
                        <li id="charSituation02"></li>
                    </ul>
                </ul>
            </div>
            <img id="charLOGO" src="img/LOGO.png">
        </div>
        <div id="description">
            <h3>Description</h3>
            <p id="charDescription"></p>
        </div>
    </section>
    <section id="gallery">
        <h2 id="galleryTitle" data-i18n="gallery">Gallery</h2>

        <div class="carousel">
            <button class="nav prev"><img src="icons/buttons/button_left.png" alt="Left button"></button>
            <div class="track-container">
                <div class="track" id="galleryTrack"></div>
            </div>
            <button class="nav next"><img src="icons/buttons/button_right.png" alt="Right button"></button>
        </div>
    </section>

        <section id="videos">
            <h2 id="videoTitle" data-i18n="video">Videos</h2>
            <div id="videoAboutDiv">
                <h3 id="videoAboutTitle" data-i18n="videoAbout">Videos about the character</h3>
                <div id="videoAboutLinks"></div>
            </div>
            <div id="videoFeatDiv">
                <h3 id="videoFeatTitle" data-i18n="videoFeat">Videos where the character appears</h3>
                <div id="videoFeatLinks"></div>
            </div>
        </section>


    <div id="lightbox">
        <img id="lightboxImg">
    </div>
        <div id="powers">
            <h3 data-i18n="powers">Powers</h3>
            <p id="charPowers"></p>
        </div>
        <div id="origins">
            <img id="charIcon" alt="Funny little icon">
            <h3 data-i18n="origin">Origins</h3>
            <p id="charOrigin"></p>
        </div>
        <section id="tasteColor">
            <div id="fColor">
                <h3 data-i18n="fColor">Favorite color</h3>
                <div><p id="fColorName"></p><div id="fColorHexa"></div></div>
            </div>
            <div id="taste">
                <div class="bags">
                    <img id="likeImg" src="icons/bagLike_icon.png" alt="Bag of what they like">
                    <h4 data-i18n="like">Likes</p>
                </div>
                    <div id="likeDiv">
                        <button id="closeLike"></button>
                        <ul id="likeList"></ul>
                    </div>
                <div class="bags">
                    <img id="dislikeImg" src="icons/bagDislike_icon.png" alt="Bag of what they dislike">
                    <h4 data-i18n="dislike">Dislikes</p>
                </div>
                    <div id="dislikeDiv">
                        <button id="closeDislike"></button>
                        <ul id="dislikeList"></ul>
                    </div>
            </div>
        </section>
        <div id="blackScreen"></div>
<footer>
    <small data-i18n="pfooter">Created by NeWiAr</small>
</footer>
</body>
<script src="characters.js"></script>
<script src="languages.js"></script>
</html>
